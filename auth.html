<div id="modal-auth" class="modal-overlay">
  <div class="modal-box">
    <button class="modal-close" onclick="fecharModal()">×</button>

    <div class="modal-logo">
      <div class="logo"></div>
      <span class="logo-name">Abapyra Tech</span>
    </div>

    <div class="modal-tabs">
      <button class="tab ativo" onclick="trocarAba('login')">Entrar</button>
      <button class="tab" onclick="trocarAba('cadastro')">Cadastrar</button>
    </div>

    <!-- Login -->
    <div id="form-login" class="modal-form">
      <input type="email" id="login-email" placeholder="E-mail">
      <input type="password" id="login-senha" placeholder="Senha">
      <button class="btn-modal-primary" onclick="submeterLogin()">Entrar</button>
      <div class="modal-divider"><span>ou</span></div>
      <button class="btn-social">
        <i class="fa-brands fa-google"></i> Continuar com Google
      </button>
      <button class="btn-social">
        <i class="fa-brands fa-facebook"></i> Continuar com Facebook
      </button>
      <p class="modal-footer-text"><a href="#">Esqueci minha senha</a></p>
    </div>

    <!-- Cadastro -->
    <div id="form-cadastro" class="modal-form hidden">
      <input type="text" id="cadastro-nome" placeholder="Nome completo">
      <input type="email" id="cadastro-email" placeholder="E-mail">
      <input type="password" id="cadastro-senha" placeholder="Senha">
      <input type="password" id="cadastro-confirmar" placeholder="Confirmar senha">
      <button class="btn-modal-primary" onclick="submeterCadastro()">Criar conta</button>
      <div class="modal-divider"><span>ou</span></div>
      <button class="btn-social">
        <i class="fa-brands fa-google"></i> Cadastrar com Google
      </button>
      <p class="modal-footer-text">
        Já tem conta? <a href="#" onclick="trocarAba('login'); return false;">Entrar</a>
      </p>
    </div>

  </div>
</div>
