<script>
  function toggleMenu() {
    document.getElementById('navLinks').classList.toggle('aberto');
    document.getElementById('navActions').classList.toggle('aberto');
  }

  // Fecha o menu ao clicar em um link
  document.querySelectorAll('.nav-links a').forEach(link => {
    link.addEventListener('click', () => {
      document.getElementById('navLinks').classList.remove('aberto');
      document.getElementById('navActions').classList.remove('aberto');
    });
  });

  fetch('includes/auth.html')
    .then(r => r.text())
    .then(html => {
      document.body.insertAdjacentHTML('beforeend', html);
      const s = document.createElement('script');
      s.src = 'js/auth.js';
      document.body.appendChild(s);
    });
</script>
