<!-- ================================================
     ABAPYRA TECH — Modal de Autenticação
     Arquivo: includes/auth.html
     ================================================ -->

<div id="auth-overlay" class="auth-overlay" role="dialog" aria-modal="true" hidden>

  <div class="auth-modal">

    <!-- Botão fechar -->
    <button class="auth-close" onclick="fecharModal()" aria-label="Fechar">
      <i class="fa-solid fa-xmark"></i>
    </button>

    <!-- Logo -->
    <div class="auth-brand">
      <img src="Imagens/abapyra-logo.png" alt="Abapyra" class="auth-logo-img">
      <span class="auth-brand-name">Abapyra Tech</span>
    </div>

    <!-- Abas -->
    <div class="auth-tabs" role="tablist">
      <button id="tab-login"
              class="auth-tab active"
              role="tab"
              onclick="trocarAba('login')">
        Entrar
      </button>
      <button id="tab-cadastro"
              class="auth-tab"
              role="tab"
              onclick="trocarAba('cadastro')">
        Cadastrar
      </button>
      <span class="auth-tab-indicator" id="tab-indicator"></span>
    </div>

    <!-- ══ PAINEL LOGIN ══ -->
    <div id="painel-login" class="auth-painel active" role="tabpanel">
      <p class="auth-subtitle">Bem-vindo de volta! Acesse sua conta.</p>

      <form class="auth-form" onsubmit="handleLogin(event)">

        <div class="auth-field">
          <label for="login-email">E-mail</label>
          <div class="auth-input-wrap">
            <i class="fa-solid fa-envelope auth-input-icon"></i>
            <input id="login-email" type="email" placeholder="seu@email.com" required autocomplete="email">
          </div>
        </div>

        <div class="auth-field">
          <label for="login-senha">Senha</label>
          <div class="auth-input-wrap">
            <i class="fa-solid fa-lock auth-input-icon"></i>
            <input id="login-senha" type="password" placeholder="••••••••" required autocomplete="current-password">
            <button type="button" class="auth-olho" onclick="toggleSenha('login-senha', this)" aria-label="Mostrar senha">
              <i class="fa-solid fa-eye"></i>
            </button>
          </div>
        </div>

        <div class="auth-opcoes">
          <label class="auth-check">
            <input type="checkbox"> Lembrar de mim
          </label>
          <a href="#" class="auth-link">Esqueci minha senha</a>
        </div>

        <div class="auth-msg" id="login-msg"></div>

        <button type="submit" class="auth-btn-submit">
          <span>Entrar</span>
          <i class="fa-solid fa-arrow-right"></i>
        </button>

      </form>

      <div class="auth-divider"><span>ou continue com</span></div>

      <div class="auth-sociais">
        <button class="auth-social-btn" type="button">
          <svg width="18" height="18" viewBox="0 0 48 48">
            <path fill="#FFC107" d="M43.6 20H24v8h11.3C33.6 33.1 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3 0 5.7 1.1 7.8 2.9l5.7-5.7C34 6.5 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20c11 0 19.6-8 19.6-20 0-1.3-.1-2.7-.4-4z"/>
            <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.1 19 12 24 12c3 0 5.7 1.1 7.8 2.9l5.7-5.7C34 6.5 29.3 4 24 4 16.3 4 9.7 8.4 6.3 14.7z"/>
            <path fill="#4CAF50" d="M24 44c5.2 0 9.9-1.9 13.5-5l-6.2-5.2C29.5 35.6 26.9 36 24 36c-5.2 0-9.6-2.9-11.3-7.1l-6.6 5.1C9.8 39.6 16.4 44 24 44z"/>
            <path fill="#1976D2" d="M43.6 20H24v8h11.3c-.9 2.5-2.6 4.6-4.8 6l6.2 5.2C40.6 36 44 30.5 44 24c0-1.3-.1-2.7-.4-4z"/>
          </svg>
          Google
        </button>
        <button class="auth-social-btn" type="button">
          <svg width="18" height="18" viewBox="0 0 24 24">
            <path fill="#1877F2" d="M24 12.07C24 5.41 18.63 0 12 0S0 5.41 0 12.07C0 18.1 4.39 23.1 10.13 24v-8.44H7.08v-3.49h3.04V9.41c0-3 1.79-4.67 4.53-4.67 1.31 0 2.69.24 2.69.24v2.97h-1.51c-1.49 0-1.96.93-1.96 1.88v2.24h3.32l-.53 3.5h-2.79V24C19.62 23.1 24 18.1 24 12.07z"/>
          </svg>
          Facebook
        </button>
      </div>

      <p class="auth-trocar">
        Não tem conta?
        <button type="button" class="auth-link-btn" onclick="trocarAba('cadastro')">Cadastre-se grátis</button>
      </p>
    </div>

    <!-- ══ PAINEL CADASTRO ══ -->
    <div id="painel-cadastro" class="auth-painel" role="tabpanel">
      <p class="auth-subtitle">Crie sua conta e faça parte da mudança.</p>

      <form class="auth-form" onsubmit="handleCadastro(event)">

        <div class="auth-field">
          <label for="cad-nome">Nome completo</label>
          <div class="auth-input-wrap">
            <i class="fa-solid fa-user auth-input-icon"></i>
            <input id="cad-nome" type="text" placeholder="Seu nome completo" required autocomplete="name">
          </div>
        </div>

        <div class="auth-field">
          <label for="cad-email">E-mail</label>
          <div class="auth-input-wrap">
            <i class="fa-solid fa-envelope auth-input-icon"></i>
            <input id="cad-email" type="email" placeholder="seu@email.com" required autocomplete="email">
          </div>
        </div>

        <div class="auth-field">
          <label for="cad-senha">Senha</label>
          <div class="auth-input-wrap">
            <i class="fa-solid fa-lock auth-input-icon"></i>
            <input id="cad-senha" type="password" placeholder="Mínimo 8 caracteres" required minlength="8"
                   oninput="verificarForca(this.value)" autocomplete="new-password">
            <button type="button" class="auth-olho" onclick="toggleSenha('cad-senha', this)" aria-label="Mostrar senha">
              <i class="fa-solid fa-eye"></i>
            </button>
          </div>
          <div class="senha-forca">
            <div class="forca-barra">
              <span id="fb1"></span><span id="fb2"></span>
              <span id="fb3"></span><span id="fb4"></span>
            </div>
            <small id="forca-texto"></small>
          </div>
        </div>

        <div class="auth-field">
          <label for="cad-confirma">Confirmar senha</label>
          <div class="auth-input-wrap">
            <i class="fa-solid fa-lock auth-input-icon"></i>
            <input id="cad-confirma" type="password" placeholder="Repita a senha" required autocomplete="new-password">
            <button type="button" class="auth-olho" onclick="toggleSenha('cad-confirma', this)" aria-label="Mostrar senha">
              <i class="fa-solid fa-eye"></i>
            </button>
          </div>
        </div>

        <label class="auth-check auth-check-termos">
          <input type="checkbox" id="cad-termos" required>
          Concordo com os <a href="#" class="auth-link">Termos de Uso</a> e
          <a href="#" class="auth-link">Política de Privacidade</a>
        </label>

        <div class="auth-msg" id="cad-msg"></div>

        <button type="submit" class="auth-btn-submit">
          <span>Criar conta</span>
          <i class="fa-solid fa-user-plus"></i>
        </button>

      </form>

      <p class="auth-trocar">
        Já tem conta?
        <button type="button" class="auth-link-btn" onclick="trocarAba('login')">Fazer login</button>
      </p>
    </div>

  </div>
</div>
